name: e2e

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "control-plane/**"
      - "docker-compose.yml"
      - "scripts/verify-stack.sh"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "website/**"
      - "control-plane/**"
      - "docker-compose.yml"
      - "scripts/verify-stack.sh"
      - ".github/workflows/e2e.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website deps
        working-directory: website
        run: npm ci

      - name: Install Playwright browser
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: Prepare env
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          CONTROL_PLANE_NODE_ENV=development
          CONTROL_PLANE_SEED_DEV_DATA=1
          CONTROL_PLANE_BOOTSTRAP_EMAIL=e2e@agf.local
          CONTROL_PLANE_BOOTSTRAP_PASSWORD=e2e-test-password-16ch
          CONTROL_PLANE_BOOTSTRAP_CUSTOMER=cust_dev
          EOF

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for stack
        run: |
          for i in $(seq 1 60); do
            if bash scripts/verify-stack.sh; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs --tail=80
          exit 1

      - name: Run Playwright smoke
        working-directory: website
        env:
          AGF_E2E_BASE_URL: http://127.0.0.1:8088
          AGF_E2E_API_URL: http://127.0.0.1:4046
          AGF_E2E_EMAIL: e2e@agf.local
          AGF_E2E_PASSWORD: e2e-test-password-16ch
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: website/playwright-report/
          if-no-files-found: ignore
