# Control plane Deployment + Service (SQLite PVC)
# Companion to kernel manifests in 02-deployment.yaml and website in 10-website.yaml.
#
# Prerequisites:
# - Namespace `agf` (01-namespace.yaml)
# - Secret `agf-control-plane` with keys:
#     CONTROL_PLANE_JWT_SECRET (>=32 chars, non-default)
#     optional: CONTROL_PLANE_API_KEY
# - Image built from repo `control-plane/Dockerfile` and pushed to your registry
#
# Example secret:
#   kubectl -n agf create secret generic agf-control-plane \
#     --from-literal=CONTROL_PLANE_JWT_SECRET="$(openssl rand -hex 32)"
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agf-control-plane-data
  namespace: agf
  labels:
    app: agf-control-plane
    app.kubernetes.io/part-of: agf
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agf-control-plane
  namespace: agf
  labels:
    app: agf-control-plane
    app.kubernetes.io/part-of: agf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agf-control-plane
  template:
    metadata:
      labels:
        app: agf-control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: control-plane
          image: registry.neurocluster.dev/agf-control-plane:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: "production"
            - name: CONTROL_PLANE_DATA
              value: /data
            - name: AGF_KERNEL_URL
              value: http://agf-evaluator.agf.svc.cluster.local:3000
            - name: CONTROL_PLANE_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: agf-control-plane
                  key: CONTROL_PLANE_JWT_SECRET
            - name: CONTROL_PLANE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agf-control-plane
                  key: CONTROL_PLANE_API_KEY
                  optional: true
          securityContext:
            privileged: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: agf-control-plane-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agf-control-plane
  namespace: agf
  labels:
    app: agf-control-plane
    app.kubernetes.io/part-of: agf
spec:
  selector:
    app: agf-control-plane
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
