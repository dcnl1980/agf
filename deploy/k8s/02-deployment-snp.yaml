# AGF Evaluator Deployment — confidential runtime candidate (kata-qemu-snp)
#
# Use this profile only after deploy/k8s/verify-production-truth.sh succeeds
# on the target cluster.
#
# This manifest expresses the intended production-truth posture:
# - Kata confidential runtime (`kata-qemu-snp`)
# - SNP-capable node selection via kata runtime labels
# - non-root, read-only workload posture
# - explicit TEE mode declaration at deploy time
#
# Note: the application currently exposes mock attestation in the response path.
# This manifest is therefore a deployment candidate, not a sufficient proof by itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agf-evaluator
  namespace: agf
  labels:
    app: agf-evaluator
    app.kubernetes.io/part-of: agf
    agf.neurocluster.io/layer: "2-kata-snp"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agf-evaluator
  template:
    metadata:
      labels:
        app: agf-evaluator
        agf.neurocluster.io/sandbox: "kata-snp"
    spec:
      runtimeClassName: kata-qemu-snp
      nodeSelector:
        katacontainers.io/kata-runtime: "true"
      automountServiceAccountToken: false

      containers:
        - name: agf-server
          image: registry.neurocluster.dev/agf-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http

          securityContext:
            privileged: false
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]

          envFrom:
            - configMapRef:
                name: agf-signing-config
          env:
            - name: AGF_SIGNING_KEY_HEX
              valueFrom:
                secretKeyRef:
                  name: agf-signing-key
                  key: AGF_SIGNING_KEY_HEX
            - name: AGF_TEE_MODE
              value: "require-hardware"

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
