# CCPA/CPRA - California Consumer Privacy Act

[metadata]
schema_version = "0.1.0"
jurisdiction = "US-CA"
regulator = "CPPA"
regulation = "CCPA / CPRA"
regulation_ref = "Cal. Civ. Code § 1798.100 et seq."
effective_date = "2020-01-01"
last_updated = "2026-04-01"
author = "AGF Compliance Team"
review_status = "draft"

[metadata.source]
title = "California Consumer Privacy Act of 2018"
url = "https://oag.ca.gov/privacy/ccpa"
section = "Title 1.81.5. Part 4 of Division 3 of the Civil Code"

# ─── Rule 1: Do Not Sell or Share My Personal Information ───────────────────

[[rule]]
id = "CCPA-DNS-001"
name = "Do Not Sell Enforcement Gate"
description = "Prevents the sharing or selling of consumer personal information if the consumer has exercised their right to opt-out via the 'Do Not Sell' flag."
category = "privacy_opt_out"
severity = "critical"
entity_type = "business"

[rule.source]
regulation = "CCPA"
article = "1798.120(a)"
text = "A consumer shall have the right, at any time, to direct a business that sells or shares personal information about the consumer to third parties not to sell or share the consumer's personal information."

[rule.condition]
# If opted_out_of_sale is 1, block the action. We check that it equals 0.
type = "equals"
field = "opted_out_of_sale"
threshold = 0
unit = "boolean_flag"

[rule.enforcement]
on_pass = "allow"
on_fail = "block"
