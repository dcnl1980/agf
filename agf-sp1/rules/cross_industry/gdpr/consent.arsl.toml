# File: rules/gdpr/consent.arsl.toml
# AGF Rule Specification Language (ARSL) v0.1.0
# GDPR / EU AI Act — Consent and Lawful Basis Checks
# Reference: AGF OpenSpec v2.0 §5.4, Vertical: Consent Checks

[metadata]
schema_version = "0.1.0"
jurisdiction = "EU"
regulator = "ICO"
regulation = "GDPR / EU AI Act"
regulation_ref = "GDPR 2016/679 + EU AI Act 2024/1689"
effective_date = "2018-05-25"
last_updated = "2026-03-22"
author = "AGF Compliance Team"
review_status = "draft"

[metadata.source]
title = "General Data Protection Regulation (EU) 2016/679 + EU Artificial Intelligence Act"
url = "https://gdpr-info.eu"
section = "Article 6 — Lawfulness of processing; Article 9 — Special categories"

# ─── Rule 1: Explicit GDPR Consent ───────────────────────────────────────────

[[rule]]
id = "GDPR-CON-001"
name = "Explicit GDPR Article 6(1)(a) Consent"
description = "Data subject must have given explicit consent to processing before this event"
category = "consent"
severity = "critical"
entity_type = "data_controller"

[rule.source]
regulation = "GDPR"
article = "Article 6(1)(a)"
text = "The data subject has given consent to the processing of his or her personal data for one or more specific purposes"

[rule.condition]
type = "boolean_true"
field = "gdpr_explicit_consent"
unit = "boolean"

[rule.enforcement]
on_pass = "allow"
on_fail = "block"

# ─── Rule 2: Special Category Explicit Consent ────────────────────────────────

[[rule]]
id = "GDPR-CON-002"
name = "Special Category Explicit Consent (Article 9)"
description = "Explicit consent required for processing health, biometric, or political opinion data"
category = "consent"
severity = "critical"
entity_type = "data_controller"

[rule.source]
regulation = "GDPR"
article = "Article 9(2)(a)"
text = "Processing is necessary for reasons of substantial public interest, on the basis of Union or Member State law"

[rule.condition]
type = "boolean_true"
field = "special_category_consent"
unit = "boolean"

[rule.enforcement]
on_pass = "allow"
on_fail = "block"

# ─── Rule 3: Right to Erasure — No Active Erasure Request ────────────────────

[[rule]]
id = "GDPR-ERA-001"
name = "No Active Erasure Request Gate"
description = "Processing must not continue for a data subject who has exercised the right to erasure"
category = "erasure"
severity = "critical"
entity_type = "data_controller"

[rule.source]
regulation = "GDPR"
article = "Article 17"
text = "The data subject shall have the right to obtain from the controller the erasure of personal data"

[rule.condition]
# erasure_request_active = 0 (no active request) → PASS
# erasure_request_active = 1 (active request) → BLOCK via not_equals
type = "equals"
field = "erasure_request_active"
threshold = 0
unit = "boolean_flag"

[rule.enforcement]
on_pass = "allow"
on_fail = "block"

# ─── Rule 4: Data Retention — Within Retention Period ────────────────────────

[[rule]]
id = "GDPR-RET-001"
name = "Data Retention Period Gate"
description = "Data must not be processed beyond the defined retention period (days since collection)"
category = "retention"
severity = "high"
entity_type = "data_controller"

[rule.source]
regulation = "GDPR"
article = "Article 5(1)(e)"
text = "Personal data shall be kept in a form which permits identification of data subjects for no longer than is necessary"

[rule.condition]
type = "maximum"
field = "days_since_collection"
# Default retention: 2 years = 730 days
threshold = 730
unit = "days"

[rule.enforcement]
on_pass = "allow"
on_fail = "block"

# ─── Rule 5: EU AI Act — High-Risk AI System Category Gate ───────────────────

[[rule]]
id = "EUAI-ART5-001"
name = "EU AI Act Article 5 Prohibited Practice Gate"
description = "AI system must not be classified as a prohibited practice under EU AI Act Article 5"
category = "ai_act"
severity = "critical"
entity_type = "ai_provider"

[rule.source]
regulation = "EU AI Act"
article = "Article 5"
text = "The following AI practices shall be prohibited: subliminal techniques, exploitation of vulnerabilities, social scoring by public authorities"

[rule.condition]
# ai_prohibited_category = 1 → BLOCK (prohibited)
# ai_prohibited_category = 0 → PASS (not prohibited)
type = "equals"
field = "ai_prohibited_category"
threshold = 0
unit = "boolean_flag"

[rule.enforcement]
on_pass = "allow"
on_fail = "block"
