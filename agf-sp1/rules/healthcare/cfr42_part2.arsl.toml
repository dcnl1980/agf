# ─── Rule 1: SUD Record Disclosure Consent ────────────────────────────────

[[rule]]
id = "CFR42-SUD-001"
name = "SUD Record Disclosure Consent Gate"
description = "Patient records related to substance use disorder require explicit written consent for disclosure."
category = "disclosure_consent"
severity = "critical"
entity_type = "sud_treatment_program"

[rule.source]
regulation = "42 CFR Part 2"
article = "§ 2.31 Consent requirements"
text = "A written consent to a disclosure under the regulations in this part must include..."

[rule.condition]
type = "boolean_true"
field = "sud_disclosure_consent"
unit = "boolean"

[rule.enforcement]
on_pass = "allow"
on_fail = "block"
